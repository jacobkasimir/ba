services:
  gateway:
    build: ./gateway
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aktin}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY}
      MIN_CELL_COUNT: ${MIN_CELL_COUNT:-5}
    ports:
      # Development access only. Remove this mapping after the API is connected.
      - "127.0.0.1:8001:8000"
    extra_hosts:
      # Enables access to a database running on the host computer.
      - "host.docker.internal:host-gateway"
    volumes:
      # Stores local audit records independently of the container.
      - gateway_audit:/app/audit
    networks:
      - service_network
      - database_network
  
  application:
    build:
      context: ./application
      target: runtime

    environment:
      MCP_CONFIG_PATH: /app/config/mcp_servers.json
      APP_LOG_PATH: /app/logs/app.log.jsonl

      # Development only. Disable before exposing the app more broadly.
      ENABLE_DEBUG_TOOLS: "true"

      APP_GATEWAY_URL: ${APP_GATEWAY_URL:-http://host.docker.internal:8001}
      APP_GATEWAY_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY}
      APP_GATEWAY_TIMEOUT: 12
      LLM_ENABLED: "${LLM_ENABLED:-false}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_LOG_RAW_RESPONSES: "${LLM_LOG_RAW_RESPONSES:-false}"

    ports:
      # Application API on your Mac.
      - "127.0.0.1:8080:8000"

    volumes:
      # Connection configuration is read-only inside the container.
      - ./config/mcp_servers.json:/app/config/mcp_servers.json:ro

      # Serve frontend edits directly without rebuilding the application image.
      - ./application/static:/app/static:ro

      # Application operational logs persist across container replacement.
      - application_logs:/app/logs

      # Generated project documentation is shared read-only from the docs service.
      - project_docs_site:/app/docs-site:ro

    depends_on:
      docs:
        condition: service_healthy

    networks:
      - service_network

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  mcp-schema:
    build:
      context: ./mcp_servers
      target: schema

    networks:
      - service_network

    # Prevent modifications to the container's main filesystem.
    read_only: true

    # Provide writable temporary space if a dependency needs it.
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL


  mcp-constraints:
    build:
      context: ./mcp_servers
      target: constraints

    networks:
      - service_network

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL


  mcp-examples:
    build:
      context: ./mcp_servers
      target: examples

    networks:
      - service_network

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  docs:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    restart: unless-stopped
    network_mode: none
    volumes:
      - ./README.md:/workspace/README.md:ro
      - ./mkdocs.yml:/workspace/mkdocs.yml:ro
      - ./docs:/workspace/docs:ro
      - ./evaluation/reports:/workspace/evaluation/reports:ro
      - ./application/app:/source/application/app:ro
      - ./gateway/app:/source/gateway/app:ro
      # pdoc output is isolated from the source docs and ignored by Git.
      - project_docs_api:/generated
      - project_docs_site:/site
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/site/index.html').is_file() else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  postgres:
    image: postgres:16
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DB_NAME:-aktin}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set admin password}
      QUERY_RO_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      # Persistent PostgreSQL data.
      - pgdata:/var/lib/postgresql/data

      # Executed only when the database volume is initialized.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - database_network

networks:
  service_network:
  database_network:
    internal: true

volumes:
  pgdata:
  gateway_audit:
  application_logs:
  project_docs_site:
  project_docs_api:
